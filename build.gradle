buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id "io.sentry.jvm.gradle" version "6.14.0"
}

sentry {
    org = "hard-click"
    projectName = "java-spring-boot"
}

group = 'com.wanted'
version = '0.0.1-SNAPSHOT'
description = 'Hard-Click-BackEnd'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // 아키텍처 규칙 검증 (Gate 1 · 결정론) — 클린아키텍처 레이어 의존성 강제
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    runtimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // AWS SDK v2 — S3 파일 스토리지
    implementation platform('software.amazon.awssdk:bom:2.26.12')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sts'

    // AI 코드 리뷰 루프 · Gate 2 — LLM Judge (선택 어댑터: Claude)
    // swagger-annotations 제외: springdoc의 swagger-annotations-jakarta와 패키지가 겹쳐
    // 구버전(2.2.31) Schema가 먼저 로드되면 /v3/api-docs가 NoSuchMethodError로 죽는다.
    implementation('com.anthropic:anthropic-java:2.34.0') {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// AI 코드 리뷰 루프 · 사람 검토 게이트 CLI 데모 (./gradlew reviewCli)
tasks.register('reviewCli', JavaExec) {
    group = 'review-loop'
    description = '사람 검토 게이트를 터미널에 표시(개발자 도구 표면)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wanted.backend.reviewloop.judge.ReviewLoopCli'
}

// AI 코드 리뷰 루프 · 범용 러너 — 도메인 owner가 자기 경로로 실행
//   ./gradlew reviewLoop --args="--path src/main/java/com/wanted/backend/domain/cart --domain cart --max 3"
//   (-Ppath는 Gradle 예약 프로퍼티 project.path와 충돌하므로 --args 사용)
tasks.register('reviewLoop', JavaExec) {
    group = 'review-loop'
    description = '지정 경로/변경파일에 리뷰 루프 실행 (--args="--path <dir> | --files-from <list> [--gate]")'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wanted.backend.reviewloop.judge.ReviewLoopRunner'
}

// AI 코드 리뷰 루프 · pre-push 훅 활성화 (클론 후 1회) — core.hooksPath를 .githooks로 지정
tasks.register('installReviewHooks', Exec) {
    group = 'review-loop'
    description = 'pre-push 훅 활성화(git config core.hooksPath .githooks)'
    commandLine 'git', 'config', 'core.hooksPath', '.githooks'
    doLast { println 'pre-push 훅 활성화됨(.githooks). 우회 필요 시: git push --no-verify' }
}

// AI 코드 리뷰 루프 · Minor 수정 요청서 생성 (판정=Gemini) — Claude Code 드라이버가 읽어 수정
//   ./gradlew reviewFix -Pargs="--path src/main/java/com/wanted/backend/domain/cart --domain cart"
tasks.register('reviewFix', Exec) {
    group = 'review-loop'
    description = 'Minor 수정 요청서 생성: Gemini 판정 → 방안 포함 요청서 (Claude Code가 처리) (-Pargs="--path ... | --files-from ...")'
    commandLine 'bash', 'scripts/review-fix.sh'
    def a = (project.findProperty('args') ?: '').toString().trim()
    if (a) { args(a.split(' ')) }
}
