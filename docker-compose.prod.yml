services:
  app:
    image: jongjun/hard-click-backend:latest
    container_name: hard-click-app
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      # 유사문제 추천 AI 서버 (quiz.ai.*) — SSM /hard-click/prod/QUIZ_AI_* 파라미터로 주입.
      # 파라미터 미설정 시 기본값 false로 기능이 안전하게 꺼진다.
      - QUIZ_AI_ENABLED=${QUIZ_AI_ENABLED:-false}
      - QUIZ_AI_BASE_URL=${QUIZ_AI_BASE_URL:-http://localhost:8000}
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: hard-click-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
