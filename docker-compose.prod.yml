services:
  app:
    image: jongjun/hard-click-backend:latest
    container_name: hard-click-app
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      # 유사문제 추천 AI 서버 (quiz.ai.*) — SSM /hard-click/prod/QUIZ_AI_* 파라미터로 주입.
      # 파라미터 미설정 시 기본값 false로 기능이 안전하게 꺼진다.
      - QUIZ_AI_ENABLED=${QUIZ_AI_ENABLED:-false}
      - QUIZ_AI_BASE_URL=${QUIZ_AI_BASE_URL:-http://localhost:8000}
      # 수강→즉시 스케줄 생성 AI(Python 스케줄 엔진, Flask :5000, /generate-for-member).
      # SSM /hard-click/prod/SCHEDULE_AI_* 파라미터로 주입. BASE_URL을 실제 Python 호스트로
      # 세팅하기 전까지는 localhost(=no-op, fail-soft)라 수강신청은 정상 동작한다.
      - SCHEDULE_AI_ENABLED=${SCHEDULE_AI_ENABLED:-true}
      - SCHEDULE_AI_BASE_URL=${SCHEDULE_AI_BASE_URL:-http://localhost:5000}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: hard-click-promtail
    volumes:
      - ./monitoring/promtail-config.prod.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/hard-click:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - app
