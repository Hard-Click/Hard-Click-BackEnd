name: Gate 1 · 결정론 규칙

# AI 코드 리뷰 루프 — Gate 1(결정론) 게이트. 위반 시 merge를 차단하는 하드 게이트.
# 대상: ArchUnit(아키텍처) + rules.yaml의 enforced_by=test 규칙 검증(현재 QDIFF).
# 전부 정적분석/도메인 단위 테스트라 DB·Redis·시크릿이 필요 없다(빠르고 안정적).
# 기존 CI(pr-ci.yml)는 `build -x test`로 테스트를 제외하므로, 이 게이트를 별도 잡으로 둔다.
# TODO(확장): 규칙이 늘면 @Tag("gate1")로 태깅해 `--tests` 나열 대신 태그로 실행.

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  gate1:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x gradlew

      # Gate 1 규칙만 실행 (전체 테스트 스위트를 켜지 않는다).
      # - ArchUnit: ARCH_001/002 하드 규칙, ARCH_003은 baseline 대비 신규 위반만 실패.
      # - QDIFF: 시범 기능(퀴즈 난이도) 도메인·요청 검증.
      - name: Gate 1 — 결정론 규칙 검증
        run: >-
          ./gradlew test
          --tests "com.wanted.backend.architecture.ArchitectureRulesTest"
          --tests "com.wanted.backend.domain.quiz.domain.model.QuizQuestionTest"
          --tests "com.wanted.backend.domain.quiz.presentation.request.InstructorQuizRequestValidationTest"
          --no-daemon

      - name: Publish Gate 1 results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/test/*.xml
          check_name: "Gate 1 · 결정론 규칙"

  # Gate 1 · Semgrep (QUERY_002) — 코드 패턴 정적검사. baseline-diff-only: 신규 @Query만 차단.
  # semgrep 컨테이너 이미지를 써서 별도 설치 없이 실행. 기존 20곳은 base 커밋 기준 baseline이라 통과.
  semgrep-query:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout (full history for baseline diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate 1 — Semgrep QUERY_002 (신규 @Query만 차단)
        run: >-
          semgrep scan
          --config review-loop/semgrep/query.yml
          --baseline-commit ${{ github.event.pull_request.base.sha }}
          --error
