name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시 (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: jongjun/hard-click-backend:latest

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if ! docker compose version > /dev/null 2>&1; then
              mkdir -p ~/.docker/cli-plugins
              curl -SL https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
              chmod +x ~/.docker/cli-plugins/docker-compose
            fi

            mkdir -p ~/hard-click

            curl -fsSL https://raw.githubusercontent.com/Hard-Click/Hard-Click-BackEnd-Module4/main/docker-compose.prod.yml \
              -o ~/hard-click/docker-compose.prod.yml

            cat > ~/hard-click/.env << 'ENVEOF'
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            TOSS_SECRET_KEY=${{ secrets.TOSS_SECRET_KEY }}
            S3_PRESIGN_ACCESS_KEY=${{ secrets.S3_PRESIGN_ACCESS_KEY }}
            S3_PRESIGN_SECRET_KEY=${{ secrets.S3_PRESIGN_SECRET_KEY }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            ENVEOF

            cd ~/hard-click
            docker compose -f docker-compose.prod.yml pull app

            # docker-compose가 관리하지 않는 동일 이름의 컨테이너(수동 docker run 등)가 남아있으면
            # "Conflict. The container name ... is already in use" 에러로 up -d가 조용히 실패하므로 먼저 제거한다.
            docker rm -f hard-click-app 2>/dev/null || true

            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
