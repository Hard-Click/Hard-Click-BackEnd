name: Gate 2 · LLM Judge

# AI 코드 리뷰 루프 — Gate 2(의미규칙 LLM 판정) 게이트.
#  - gate2-deterministic : 키 불필요. 채점·근거검증(Evidence)·카탈로그 정규화 등 "코드가 판단"하는
#                          결정론 로직을 검증하는 하드 게이트(위반 시 merge 차단).
#  - gate2-live-judge    : GitHub Actions Secret(GEMINI_API_KEY)을 런타임 주입해 실제 Gemini 연동을 확인.
#                          단 LLM은 비결정적이라 답변 편차로 PR을 헛되이 막지 않도록 informational(continue-on-error).
# 시크릿은 fork PR에는 GitHub이 주입하지 않으며(보안), 키가 비면 라이브 테스트는 @EnabledIf로 자동 skip된다.
# 키 값은 로그에 출력하지 않는다(Actions가 secret을 자동 마스킹하지만, 어떤 스텝에서도 echo 금지).

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ── 하드 게이트: 키 불필요, LLM은 stub. 판정/채점/근거검증/정규화 결정론 로직만 검증 ──
  gate2-deterministic:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x gradlew

      # reviewloop.judge.* 전체 실행. 라이브(Gemini*/Claude*)는 키가 없으므로 @EnabledIf로 skip된다.
      - name: Gate 2 — 결정론 판정 로직 검증 (키 불필요)
        run: >-
          ./gradlew test
          --tests "com.wanted.backend.reviewloop.judge.*"
          --no-daemon

      - name: Publish Gate 2 (결정론) 결과
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: build/test-results/test/*.xml
          check_name: "Gate 2 · 결정론 판정"

  # ── 라이브 연동: secret 주입. LLM 비결정성 때문에 merge를 막지 않음(informational) ──
  gate2-live-judge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: true   # 라이브 판정 실패가 merge를 막지 않는다(하드 게이트는 gate2-deterministic)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x gradlew

      # 키는 env로만 주입 — 어떤 스텝에서도 값을 출력하지 않는다.
      - name: Gate 2 — 라이브 Judge (Gemini, secret 주입)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          ./gradlew test
          --tests "com.wanted.backend.reviewloop.judge.Gemini*LiveTest"
          --no-daemon
