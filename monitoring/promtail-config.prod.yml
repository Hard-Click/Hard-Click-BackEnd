server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://<MONITORING_PRIVATE_IP>:3100/loki/api/v1/push

scrape_configs:
  - job_name: hard-click-backend
    static_configs:
      - targets: [localhost]
        labels:
          job: hard-click-backend
          __path__: /var/log/hard-click/*.log
